#Simple Dark Themed Polybar
#Made by Lefipexz

#Color Schemed - Based on Mantis XFCE Theme

[colors]
darker-black = #0d0d0d
black = #F6151515
light-black = #1d1d1d
dark-grey = #202020
grey = #2d2d2d
light-grey = #3a3a3a
white = #d8dee9
dark-white = #737373
light-white = #525252

#Main Preferences - The principal visual assets(Based on the 1366x768 screen)

[bar/mantis]
width = 96%
height = 24pt
radius = 0
offset-x = 2%
offset-y = 1%
fixed-center = true
; dpi = 96

background = ${colors.black}
foreground = ${colors.light-grey}

line-size = 3pt

; border-size = 4pt
; border-color = #00000000

padding-left = 1
padding-right = 1

; module-margin = 1

; separator = |
; separator-foreground = ${colors.light-grey}

font-0 = Iosevka Nerd Font:size=10;2
font-1 = Arimo Nerd Font:size=13;2

modules-left = xworkspaces memory cpu
modules-center = date
modules-right = battery pulseaudio wlan bluetooth logout

;cursor-click = pointer
;cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3
override-redirect = true


#Workspaces - Visual indicator for the workspaces

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.grey}
label-active-foreground = ${colors.white}
label-active-underline= ${colors.white}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.dark-white}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.dark-grey}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.light-white}
label-empty-padding = 1

#Volume - Audio controler based on Pulseaudio

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = %{T2}  󰕾 %{T-} 
format-volume-prefix-foreground = ${colors.white}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.dark-white}

label-muted = %{T2}  󰖁 %{T-}
label-muted-foreground = ${colors.white}
use-ui-max = false

#RAM Monitor - Quick memory viewer

[module/memory]
type = internal/memory
interval = 2
format-prefix = "%{F#3a3a3a} | %{F#d8dee9}RAM "
format-prefix-foreground = ${colors.white}
format-foreground = ${colors.dark-white}
label = %percentage_used:2%%

#CPU monitor - Simple processor viewer

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  CPU " 
format-prefix-foreground = ${colors.white}
format-foreground = ${colors.dark-white}
label = %percentage:2%%

#Internet - Network manager based on wlan

[module/wlan]
type = internal/network
interface = wlo1
interface-type = wireless
interval = 5

format-connected = %{F#3a3a3a} |%{F-} <ramp-signal>
ramp-signal-foreground = ${colors.white}

ramp-signal-0 = %{T2}󰤮 %{T-}
ramp-signal-1 = %{T2}󰤯 %{T-}
ramp-signal-2 = %{T2}󰤟 %{T-}
ramp-signal-3 = %{T2}󰤢 %{T-}
ramp-signal-4 = %{T2}󰤥 %{T-}
ramp-signal-5 = %{T2}󰤨 %{T-}

#Blueman - Bluetooth controler set with blueman

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/polybar-bluetooth
interval = 5
format = <label>
label = %{T2} %output%%{T-}
label-foreground = ${colors.white}

#Battery - Simple way to view battery percentage

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 100
low-at = 20
poll-interval = 5

format-charging = <label-charging>
label-charging = %{T2}󰂄%{T-} %{F#737373}%percentage%%

format-discharging = <label-discharging>
label-discharging = %{T2}󱊣%{T-} %{F#737373}%percentage%%

label-full = %{T2}󰁹%{T-} %{F#737373}%percentage%%
format-full-foreground = ${colors.white}

#Clock and Calendar - just the date panel

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.white}

#Logout - quick way to exit session or even turn off

[module/logout]
type = custom/text
label = %{F#3a3a3a} | %{F#d8dee9}%{T2}󰐥 %{T-}
label-foreground = #d8dee9

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
